[project]
name = "estran"
version = "0.1.0"
description = "Estran : ontologie, collecte et API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.165",
    "httpx>=0.28",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy>=2.1",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["estran"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL (ESTRAN_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# SQL text there is built from fixed fragments only; every value is a bound parameter.
"estran/api/queries.py" = ["S608"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["estran"]
