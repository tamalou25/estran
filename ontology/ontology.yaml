# Ontologie d'Estran : la seule description du « monde » que la plateforme connaît.
# La base, l'API et l'interface en découlent. Ajouter un type se fait ici, pas dans le code.
#
# Types de propriété : text, integer, number, boolean, date, datetime, url, enum, text_list.
# « unit: percent » affiche un nombre entre 0 et 1 comme un pourcentage.
# Règle éthique : aucun type ni propriété décrivant une personne (refusé au chargement).

version: 2

layers:
  territoire:
    label: Territoire
  infrastructure:
    label: Infrastructure
  menace:
    label: Menace

object_types:
  vulnerability:
    label: Vulnérabilité
    plural: Vulnérabilités
    layer: menace
    description: Faille de sécurité référencée par un identifiant CVE.
    columns: [kev_date_added, cvss_severity, epss_score, ransomware_use]
    default_sort: {by: kev_date_added, order: desc}
    properties:
      name:
        label: Nom
        type: text
        required: true
        searchable: true
      description:
        label: Description
        type: text
        searchable: true
      kev_date_added:
        label: Ajout au catalogue KEV
        type: date
      ransomware_use:
        label: Usage par rançongiciel
        type: enum
        values:
          known: Avéré
          unknown: Non connu
      cvss_severity:
        label: Gravité (CVSS)
        type: enum
        values:
          critical: Critique
          high: Élevée
          medium: Moyenne
          low: Faible
          none: Nulle
      cvss_score:
        label: Score CVSS
        type: number
      cvss_version:
        label: Version de CVSS
        type: text
      cvss_vector:
        label: Vecteur CVSS
        type: text
      epss_score:
        label: Probabilité d'exploitation (EPSS)
        type: number
        unit: percent
      epss_percentile:
        label: Rang EPSS parmi toutes les CVE
        type: number
        unit: percent
      epss_date:
        label: Date du score EPSS
        type: date
      published:
        label: Publication
        type: date
      required_action:
        label: Action requise
        type: text
      due_date:
        label: Échéance de correction
        type: date
      cwes:
        label: Faiblesses (CWE)
        type: text_list
      notes:
        label: Notes
        type: text
      cve_url:
        label: Fiche CVE
        type: url

  product:
    label: Produit
    plural: Produits
    layer: menace
    description: Logiciel ou matériel touché par des vulnérabilités.
    columns: []
    default_sort: {by: title, order: asc}
    properties:
      name:
        label: Nom
        type: text
        required: true
        searchable: true

  vendor:
    label: Éditeur
    plural: Éditeurs
    layer: menace
    description: Organisation qui édite ou fabrique des produits.
    columns: []
    default_sort: {by: title, order: asc}
    properties:
      name:
        label: Nom
        type: text
        required: true
        searchable: true

  technique:
    label: Technique
    plural: Techniques
    layer: menace
    description: Façon de faire d'un attaquant, décrite par MITRE ATT&CK.
    columns: [platforms]
    default_sort: {by: key, order: asc}
    properties:
      name:
        label: Nom
        type: text
        required: true
        searchable: true
      description:
        label: Description
        type: text
        searchable: true
      is_subtechnique:
        label: Sous-technique
        type: boolean
      platforms:
        label: Plateformes
        type: text_list
      url:
        label: Fiche ATT&CK
        type: url

  tactic:
    label: Tactique
    plural: Tactiques
    layer: menace
    description: But poursuivi par un attaquant à une étape de son intrusion.
    columns: []
    default_sort: {by: key, order: asc}
    properties:
      name:
        label: Nom
        type: text
        required: true
        searchable: true
      description:
        label: Description
        type: text
        searchable: true
      url:
        label: Fiche ATT&CK
        type: url

  group:
    label: Groupe
    plural: Groupes
    layer: menace
    description: Groupe d'attaquants suivi sous un nom commun par les analystes.
    columns: [aliases]
    default_sort: {by: title, order: asc}
    properties:
      name:
        label: Nom
        type: text
        required: true
        searchable: true
      description:
        label: Description
        type: text
        searchable: true
      aliases:
        label: Autres noms
        type: text_list
        searchable: true
      url:
        label: Fiche ATT&CK
        type: url

  software:
    label: Logiciel d'attaque
    plural: Logiciels d'attaque
    layer: menace
    description: Logiciel malveillant ou outil employé lors d'intrusions.
    columns: [kind, platforms]
    default_sort: {by: title, order: asc}
    properties:
      name:
        label: Nom
        type: text
        required: true
        searchable: true
      description:
        label: Description
        type: text
        searchable: true
      kind:
        label: Nature
        type: enum
        values:
          malware: Logiciel malveillant
          tool: Outil détourné
      aliases:
        label: Autres noms
        type: text_list
        searchable: true
      platforms:
        label: Plateformes
        type: text_list
      url:
        label: Fiche ATT&CK
        type: url

  alert:
    label: Alerte CERT-FR
    plural: Alertes CERT-FR
    layer: menace
    description: Alerte publiée par le CERT-FR sur une menace qui demande une action rapide.
    columns: [published]
    default_sort: {by: published, order: desc}
    properties:
      name:
        label: Titre
        type: text
        required: true
        searchable: true
      description:
        label: Résumé
        type: text
        searchable: true
      published:
        label: Publication
        type: date
      url:
        label: Bulletin
        type: url

link_types:
  affects:
    label: affecte
    inverse_label: est affecté par
    from: vulnerability
    to: product
  made_by:
    label: édité par
    inverse_label: édite
    from: product
    to: vendor
  exploited_via:
    label: s'exploite par
    inverse_label: sert à exploiter
    from: vulnerability
    to: technique
  enables:
    label: permet ensuite
    inverse_label: est permise par
    from: vulnerability
    to: technique
  technique_in_tactic:
    label: sert la tactique
    inverse_label: regroupe
    from: technique
    to: tactic
  subtechnique_of:
    label: précise
    inverse_label: se décline en
    from: technique
    to: technique
  group_uses_technique:
    label: emploie
    inverse_label: est employée par
    from: group
    to: technique
  group_uses_software:
    label: utilise
    inverse_label: est utilisé par
    from: group
    to: software
  software_uses_technique:
    label: met en œuvre
    inverse_label: est mise en œuvre par
    from: software
    to: technique
  alert_mentions:
    label: mentionne
    inverse_label: est mentionnée par
    from: alert
    to: vulnerability
