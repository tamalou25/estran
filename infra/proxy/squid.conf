# Proxy sortant d'Estran : la seule porte vers Internet.
# Règle : tunnels HTTPS uniquement, et uniquement vers les hôtes de la liste blanche.

http_port 3128

# --- qui peut sortir, et vers où -----------------------------------------------------------
# dstdomain sans point initial : le nom exact, pas ses sous-domaines.
acl hotes_autorises dstdomain "/etc/squid/allowlist.txt"
acl port_https port 443
acl CONNECT method CONNECT

# Pas de HTTP en clair : seuls les tunnels chiffrés (CONNECT) sont acceptés.
http_access deny !CONNECT
http_access deny CONNECT !port_https
http_access allow CONNECT hotes_autorises
# Tout le reste est refusé (réponse 403).
http_access deny all

# --- un simple relais : rien n'est conservé ------------------------------------------------
cache deny all
cache_store_log none

# --- discrétion : ne pas révéler l'adresse interne du collecteur ni la version du proxy ----
forwarded_for delete
httpd_suppress_version_string on

# --- exécution sans privilèges, système de fichiers en lecture seule -----------------------
pid_filename none
coredump_dir /tmp
# Chaque ligne du journal est une tentative de sortie : acceptée (TCP_TUNNEL) ou refusée
# (TCP_DENIED). Le contrôle de santé du conteneur n'ouvre aucune connexion, il n'y figure pas.
access_log stdio:/dev/stdout
# Pas de mesure ICMP des serveurs distants : inutile ici, et elle exigerait des privilèges.
pinger_enable off
cache_log /dev/stderr
shutdown_lifetime 1 seconds
