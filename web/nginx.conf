server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'API n'est jamais exposée directement : tout passe par ici.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Fichiers nommés par leur contenu (hash) : cache long sans risque.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Application à page unique : toute autre adresse rend index.html, le routage est côté client.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
