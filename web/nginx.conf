# Seule porte d'entrée d'Estran. nginx tourne entièrement sous un utilisateur ordinaire
# (pas de processus maître root), sur un système de fichiers en lecture seule : tout ce
# qu'il doit écrire va dans /tmp, monté en mémoire.

worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Limite de débit sur l'API : 20 requêtes par seconde et par adresse, avec une rafale
    # tolérée. Une page de l'interface en émet 3 ou 4 ; au-delà, c'est un script, il reçoit
    # une erreur 429.
    limit_req_zone $binary_remote_addr zone=api:1m rate=20r/s;
    limit_req_status 429;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 1k;   # l'API est en lecture seule : aucune requête n'a de corps

        # --- en-têtes de sécurité, envoyés sur toutes les réponses --------------------------
        # Aucune directive add_header n'est posée dans les blocs « location » ci-dessous :
        # nginx abandonnerait alors celles-ci.
        #
        # L'interface ne charge que ses propres fichiers : ni script, ni police, ni image
        # venus d'ailleurs. « data: » couvre les petits motifs SVG de la feuille de style.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # Seules les méthodes de lecture sont acceptées.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # L'API n'est jamais exposée directement : tout passe par ici.
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Fichiers nommés par leur contenu (hash) : cache long sans risque.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # Application à page unique : toute autre adresse rend index.html, toujours revalidé.
        location / {
            expires -1;
            try_files $uri /index.html;
        }
    }
}
