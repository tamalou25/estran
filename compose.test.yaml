# Tests dans des conteneurs : rien à installer sur la machine à part Docker.
#   docker compose -f compose.test.yaml run --rm tests       serveur : lint, typage, tests
#   docker compose -f compose.test.yaml run --rm web-tests   interface : lint, typage, tests
# La base de test vit en mémoire et disparaît à l'arrêt :
#   docker compose -f compose.test.yaml down

name: estran-test

services:
  db-test:
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_DB: estran_test
      POSTGRES_USER: estran
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estran -d estran_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: test
    environment:
      ESTRAN_TEST_DATABASE_URL: postgresql+psycopg://estran:test@db-test:5432/estran_test
    depends_on:
      db-test:
        condition: service_healthy

  web-tests:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: test
