# Veille automatique : chaque semaine, une proposition de mise à jour par famille de dépendances.
# Les correctifs de sécurité, eux, sont proposés dès leur publication.

version: 2
updates:
  - package-ecosystem: uv
    directory: /server
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/server, /web, /infra/proxy, /infra/db]
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
